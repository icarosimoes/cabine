# Receptor de webhook do leitor RFID Impinj + painel de leituras (cabine.solidsd.com.br)
# VPS principal (Swarm, nó único). Imagem buildada local no manager (sem registry).
#
#   ssh root@95.111.250.4
#   cd /opt/impinj && docker build -t impinj-rfid:local .
#   bash -c 'set -a; . ./.env; set +a; docker stack deploy -c impinj-stack.yml impinj'
#
# .env (chmod 600): WEBHOOK_USER, WEBHOOK_PASS, UI_USER, UI_PASS, SESSION_SECRET, SAIDA_USER, SAIDA_PASS,
#                    POSTGRES_PASSWORD, KUMA_PUSH_URL (opcional)
# Depois de rebuildar a imagem: docker service update --force impinj_impinj
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impinj
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Informe POSTGRES_PASSWORD}"
      POSTGRES_DB: impinj
    volumes:
      - impinj_pgdata:/var/lib/postgresql/data
    networks:
      - impinj-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impinj"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${IMPINJ_NODE_HOSTNAME:-vmi3286141}
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any

  # Armazenamento S3 dos vídeos das evasões. Só na rede interna (sem Traefik). Usa a mesma imagem dos MinIO das outras stacks.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Informe MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Informe MINIO_ROOT_PASSWORD}"
    volumes:
      - impinj_minio:/data
    networks:
      - impinj-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${IMPINJ_NODE_HOSTNAME:-vmi3286141}
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any

  impinj:
    image: impinj-rfid:local
    environment:
      DATABASE_URL: "postgresql://impinj:${POSTGRES_PASSWORD:?Informe POSTGRES_PASSWORD}@postgres:5432/impinj"
      WEBHOOK_USER: "${WEBHOOK_USER:?Informe WEBHOOK_USER}"
      WEBHOOK_PASS: "${WEBHOOK_PASS:?Informe WEBHOOK_PASS}"
      UI_USER: "${UI_USER:?Informe UI_USER}"
      UI_PASS: "${UI_PASS:?Informe UI_PASS}"
      SESSION_SECRET: "${SESSION_SECRET:?Informe SESSION_SECRET}"
      SAIDA_USER: "${SAIDA_USER:?Informe SAIDA_USER}"
      SAIDA_PASS: "${SAIDA_PASS:?Informe SAIDA_PASS}"
      SAIDA_JANELA_MINUTOS: "${SAIDA_JANELA_MINUTOS:-60}"
      KUMA_PUSH_URL: "${KUMA_PUSH_URL:-}"
      STALE_MINUTES: "${STALE_MINUTES:-30}"
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      WHATSAPP_API_URL: "${WHATSAPP_API_URL:-http://evolution-api:8080}"
      WHATSAPP_INSTANCE: "${WHATSAPP_INSTANCE:-}"
      WHATSAPP_APIKEY: "${WHATSAPP_APIKEY:-}"
      ALERTA_SEM_SINAL_SEGUNDOS: "${ALERTA_SEM_SINAL_SEGUNDOS:-60}"
      CLIPES_RETENCAO_DIAS: "${CLIPES_RETENCAO_DIAS:-365}"
      PUBLIC_URL: "https://${RFID_HOST:-cabine.solidsd.com.br}"
      # Armazenamento dos vídeos: padrão S3. Hoje o MinIO desta stack; para outro servidor S3 (outra VPS, AWS, Wasabi...)
      # basta trocar estas variáveis no .env (CLIPES_S3_ENDPOINT/BUCKET/ACCESS_KEY/SECRET_KEY/REGION) e remover o serviço minio.
      # Deixando CLIPES_S3_ENDPOINT vazio, volta a gravar em disco (volume impinj_clipes).
      CLIPES_S3_ENDPOINT: "${CLIPES_S3_ENDPOINT-http://minio:9000}"
      CLIPES_S3_BUCKET: "${CLIPES_S3_BUCKET:-cabine-clipes}"
      CLIPES_S3_ACCESS_KEY: "${CLIPES_S3_ACCESS_KEY:?Informe CLIPES_S3_ACCESS_KEY (usuário do MinIO)}"
      CLIPES_S3_SECRET_KEY: "${CLIPES_S3_SECRET_KEY:?Informe CLIPES_S3_SECRET_KEY (senha do MinIO)}"
      CLIPES_S3_REGION: "${CLIPES_S3_REGION:-us-east-1}"
      CLIPES_S3_PATH_STYLE: "${CLIPES_S3_PATH_STYLE:-1}"
    volumes:
      - impinj_clipes:/srv/clipes   # vídeos das evasões (mp4 enviados pelo agente)
    networks:
      - traefik-public
      - impinj-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${IMPINJ_NODE_HOSTNAME:-vmi3286141}
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.http.routers.impinj.rule=Host(`${RFID_HOST:-cabine.solidsd.com.br}`)
        - traefik.http.routers.impinj.entrypoints=websecure
        - traefik.http.routers.impinj.tls.certresolver=letsencrypt
        - traefik.http.services.impinj.loadbalancer.server.port=8000

volumes:
  impinj_pgdata:
  impinj_clipes:
  impinj_minio:

networks:
  traefik-public:
    external: true
  impinj-internal:
    driver: overlay
