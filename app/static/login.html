<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(localStorage.getItem("tema")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<title>Entrar — Cabine RFID</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0f1623;--navy-mid:#1a2333;--navy-light:#243044;--teal:#14b8a6;--red:#f87171;--muted:#8896aa;--text:#e2e8f0;--line:#1e2d42;--on-accent:#0f1623}
:root[data-theme="light"]{--navy:#f7f8fa;--navy-mid:#fff;--navy-light:#eef1f5;--teal:#0f766e;--red:#dc2626;--muted:#6b7280;--text:#1c1e26;--line:#e2e5ea;--on-accent:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--navy);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
form{background:var(--navy-mid);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.mark{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--on-accent)}
h1{font-size:18px}small{color:var(--muted);font-size:11px;display:block}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:14px 0 5px}
input{width:100%;background:var(--navy-light);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;color:var(--text);outline:none}
input:focus{border-color:var(--teal)}
button{width:100%;margin-top:20px;background:var(--teal);color:var(--on-accent);border:none;border-radius:8px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#erro{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<form id="f">
  <div class="brand"><div class="mark">C</div><div><h1>Cabine RFID</h1><small>Solid · enxoval</small></div></div>
  <label for="u">Usuário</label><input id="u" autocomplete="username" autofocus required>
  <label for="s">Senha</label><input id="s" type="password" autocomplete="current-password" required>
  <div id="erro" role="alert"></div>
  <button id="b">Entrar</button>
</form>
<script>
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const b=document.getElementById('b'),er=document.getElementById('erro');b.disabled=true;er.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('u').value,senha:document.getElementById('s').value})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'erro '+r.status)}
    location.href='/';
  }catch(x){er.textContent=x.message;b.disabled=false}
};
</script>
</body>
</html>
